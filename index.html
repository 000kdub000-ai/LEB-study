<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LEB Study</title>
  <!-- Fonts from Google Fonts (if they can't load, similar built-in fonts are used) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Oswald:wght@500&family=Source+Serif+4:wght@400;600&display=swap">
  <!-- "?v=3": raise this number (here and on app.js below) whenever you change
       style.css or app.js, so browsers load the new file instead of an old saved copy -->
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <!-- Title, shown on the home screen -->
  <header class="brand" id="brand">
    <p class="eyebrow">Contract Law</p>
    <h1>LEB Study</h1>
  </header>

  <main>
    <!-- HOME: choose what to study and how -->
    <section id="home-view">
      <!-- Pick a chapter (the choices are made from the data files) -->
      <label class="field">
        <span>Chapter</span>
        <select id="chapter-select"></select>
      </label>

      <!-- After picking a chapter: narrow it down to one topic -->
      <label class="field" id="topic-field" hidden>
        <span>Topic</span>
        <select id="topic-select"></select>
      </label>

      <fieldset class="field">
        <legend>Quiz mode</legend>
        <div class="segmented">
          <label><input type="radio" name="mode" value="easy" checked> Easy <small>Keep going</small></label>
          <label><input type="radio" name="mode" value="hard"> Hard <small>Restart on a miss</small></label>
        </div>
      </fieldset>

      <div class="actions">
        <button id="start-flash">Flashcards</button>
        <button id="start-quiz">Start quiz</button>
        <button id="start-missed" class="missed" aria-expanded="false" aria-controls="missed-choice">Review missed (<span id="missed-count">0</span>)</button>
        <!-- Shown after tapping "Review missed": pick how to review -->
        <div id="missed-choice" class="choice" hidden>
          <button id="missed-flash" class="secondary">Flashcards</button>
          <button id="missed-quiz" class="secondary">Quiz</button>
        </div>
      </div>
      <p id="home-note"></p>
      <button id="clear-missed" class="link">Clear missed list</button>
    </section>

    <!-- FLASHCARDS: tap the card to flip it -->
    <section id="flash-view" hidden>
      <div class="viewbar">
        <button class="link home-btn">&larr; Home</button>
        <p class="progress" id="flash-progress"></p>
      </div>
      <!-- A div, not a button, because content inside a button can't scroll -->
      <div id="card" class="card flashcard" role="button" tabindex="0">
        <div id="card-scroll" class="scroll"></div>
        <p id="flip-hint" class="flip-hint"></p>
      </div>
      <div class="row">
        <button id="flash-prev" class="secondary">Prev</button>
        <button id="flash-shuffle" class="secondary">Shuffle</button>
        <button id="flash-next">Next</button>
      </div>
    </section>

    <!-- QUIZ: answer, get feedback, move on -->
    <section id="quiz-view" hidden>
      <div class="viewbar">
        <button class="link home-btn">&larr; Home</button>
        <p class="progress" id="quiz-progress"></p>
      </div>
      <!-- Right answers in a row -->
      <p class="streak"><span>Streak</span> <strong id="streak-count">0</strong></p>
      <div class="card">
        <div id="quiz-scroll" class="scroll">
          <p class="topic" id="quiz-topic"></p>
          <p class="question" id="quiz-question"></p>
          <p class="hint" id="quiz-hint"></p>
          <div id="quiz-options" class="options"></div>
        </div>
      </div>
      <p id="quiz-feedback" class="feedback" aria-live="polite"></p>
      <div class="row">
        <button id="quiz-submit">Check answer</button>
        <button id="quiz-next" hidden>Next</button>
        <button id="quiz-restart" hidden>Restart</button>
      </div>
    </section>
  </main>

  <!-- Flashes over the whole screen when you lose a long streak -->
  <div id="streak-lost" class="streak-lost" role="alert" hidden>Streak lost</div>

  <!-- Study material. Each data file adds one chapter to this list.
       To add material: put a new file in data/ and add a line for it here. -->
  <script>const STUDY = [];</script>
  <script src="data/chapter-11.js"></script>
  <script src="data/chapter-12.js"></script>
  <script src="data/chapter-13.js"></script>

  <!-- The app itself (must come after the data files) -->
  <script src="app.js?v=3"></script>
  <script src="easter-eggs.js?v=5"></script>
</body>
</html>
